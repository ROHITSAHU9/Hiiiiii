<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Friendship Day Wish ✨</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            background: radial-gradient(circle at center, #2b0938, #0a0112);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }

        .video-card {
            position: relative;
            width: 90%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(255, 42, 95, 0.3),
                        0 0 20px rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            text-align: center;
        }

        video {
            width: 100%;
            height: auto;
            border-radius: 16px;
            display: block;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            outline: none;
        }

        .title {
            color: #ff758c;
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
            text-shadow: 0 0 10px rgba(255, 117, 140, 0.5);
        }
    </style>
</head>
<body>

    <div class="video-card">
        <div class="title">✨ Special Wishes For You ✨</div>
        
        <video controls autoplay loop muted playsinline>
            <source src="https://github.com/ROHITSAHU9/Hiiiiii/raw/refs/heads/main/gemini_generated_video_734025ca.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

</body>
</html>
